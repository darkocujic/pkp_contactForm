name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.0 is the floor OJS 3.4 supports, so the plugin has to parse there.
        php: ['8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: |
          status=0
          while IFS= read -r file; do
            php -l "$file" > /dev/null || status=1
          done < <(git ls-files '*.php')
          exit $status

  quality:
    name: Style, tests and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml
          coverage: none
          tools: php-cs-fixer:3, phpunit:10

      - name: Code style
        run: php-cs-fixer fix --config=.php-cs-fixer.dist.php --dry-run --diff

      - name: Unit tests
        run: phpunit

      - name: Locale keys
        run: php tools/check-locale-keys.php

      - name: Locale files parse
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext
          for file in locale/*/*.po; do
            msgfmt -c -o /dev/null "$file"
          done

      - name: XML files parse
        run: |
          for file in version.xml emailTemplates.xml scheduledTasks.xml; do
            php -r '$d = new DOMDocument(); exit($d->load($argv[1]) ? 0 : 1);' "$file"
          done

      - name: Release tarball builds and installs cleanly
        run: |
          bash tools/build-release.sh
          archive="$(ls contactForm-*.tar.gz)"
          # OJS requires exactly one top-level directory, named after the plugin.
          top="$(tar -tzf "$archive" | cut -d/ -f1 | sort -u)"
          test "$top" = "contactForm" || { echo "unexpected top level: $top"; exit 1; }
          tar -tzf "$archive" | grep -q '^contactForm/version.xml$'
          ! tar -tzf "$archive" | grep -qE '^contactForm/(ojs|tests|cypress|tools)/'
